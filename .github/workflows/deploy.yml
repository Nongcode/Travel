name: Deploy Frontend to Server (Self-hosted)

on:
  push:
    branches: [ "main" ] # Hoặc "Long" tùy vào nhánh bạn đang dùng

jobs:
  deploy:
    runs-on: self-hosted # Đây là lệnh gọi con bot trên máy chủ của bạn

    steps:
      - name: Cap nhat code va Build
        run: |
          d:
          cd D:\Travel
          git pull origin main
          npm install
          npm run build
          pm2 restart travel