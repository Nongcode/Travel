name: Deploy Frontend to Server (Self-hosted PM2)

on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Triển khai dự án tự động
        shell: cmd
        run: |
          d:
          cd D:\Travel
          
          :: Thiết lập PM2_HOME để đồng bộ tiến trình nền với tài khoản Administrator
          set "PM2_HOME=C:\Users\Administrator\.pm2"
          
          :: Lưu lại mã commit cũ để đối chiếu
          for /f %%i in ('git rev-parse HEAD') do set "OLD_COMMIT=%%i"
          git pull --ff-only origin master || exit /b 1
          
          :: Kiểm tra các file quan trọng để quyết định xem có cần npm install không
          set "NEED_INSTALL=0"
          git diff --quiet "%OLD_COMMIT%" HEAD -- package-lock.json
          if errorlevel 1 set "NEED_INSTALL=1"
          if not exist node_modules set "NEED_INSTALL=1"
          if not exist node_modules\.bin\prisma.cmd set "NEED_INSTALL=1"
          if not exist node_modules\dotenv\package.json set "NEED_INSTALL=1"
          if not exist node_modules\next\package.json set "NEED_INSTALL=1"
          
          if "%NEED_INSTALL%"=="1" (
            echo Dependencies changed or node_modules is incomplete. Running incremental npm install...
            call npx pm2 stop travel
            call npm install --prefer-offline --no-audit --no-fund
            if errorlevel 1 (
              call npx pm2 restart travel
              exit /b 1
            )
          ) else (
            echo Dependencies unchanged. Skipping dependency install.
          )
          
          :: ĐÃ THÊM LỆNH CALL VÀO ĐÂY ĐỂ WINDOWS KHÔNG BỊ THOÁT NGANG
          call npm run db:generate || exit /b 1
          call npm run db:deploy || exit /b 1
          call npm run build || exit /b 1
          
          :: Khởi động lại ứng dụng (KÈM --update-env ĐỂ NHẬN CLOUDINARY)
          call npx pm2 restart travel --update-env || call npx pm2 start ecosystem.config.js